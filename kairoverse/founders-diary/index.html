<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Founder's Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Light theme tokens for the diary content */
  :root {
    --bg:#ffffff;
    --surface:#f5f5f7;
    --surface2:#e5e5ea;
    --surface3:#d1d1d6;
    --border:#e5e5ea;
    --border-soft:#f0f0f2;
    --text:#1a1a1a;
    --text-dim:#555555;
    --text-faint:#8a8a8f;
    --accent:#1a1a1a;
    --accent-dim:#555555;
    --on-accent:#ffffff;
    --card-hover-border:#c7c7cc;
    --topbar-grad-a:#ffffff;
    --topbar-grad-b:#ffffff;
    --radius:10px;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', ui-sans-serif, system-ui, sans-serif;

    /* Tokens copied from the main site's style.css, used only by the site header and footer */
    --site-ink:#1A1A18;
    --site-line:#8F8D88;
    --site-serif:'Source Serif 4', Georgia, serif;
    --site-sans:'Inter', Helvetica, Arial, sans-serif;
    --site-gutter:clamp(24px, 4.6vw, 60px);
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font-family:var(--sans); line-height:1.5; }
  body, body * { transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#45475a; border-radius:8px; }
  ::-webkit-scrollbar-track { background:transparent; }

  /* ---- Site header (same look as the rest of the site) ---- */
  .site-header { display:flex; justify-content:space-between; align-items:baseline; padding:52px var(--site-gutter) 0; font-family:var(--site-serif); color:var(--site-ink); }
  .site-header a { color:inherit; text-decoration:none; }
  .site-header a:focus-visible { outline:2px solid var(--site-ink); outline-offset:4px; }
  .site-header .logo { font-size:46px; font-weight:500; line-height:1; }
  .site-header nav { display:flex; gap:36px; font-family:var(--site-sans); font-size:17px; }
  .site-header nav a { padding-bottom:5px; border-bottom:2px solid transparent; }
  .site-header nav a:hover { border-bottom-color:var(--site-ink); }

  /* ---- Diary title banner ---- */
  .diary-head { background:linear-gradient(180deg,var(--topbar-grad-a),var(--topbar-grad-b)); border-bottom:1px solid var(--border); }
  .wrap { width:100%; max-width:860px; margin:0 auto; padding:0 24px; }
  .diary-head .wrap { padding-top:44px; padding-bottom:28px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  h1 { font-size:clamp(1.9rem,5vw,2.6rem); font-weight:600; line-height:1.1; letter-spacing:-0.02em; margin:0; }
  .tag { font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:.04em; }
  .sub { font-size:14px; color:var(--text-dim); margin:8px 0 0; }
  .intro { font-size:14px; line-height:1.6; color:var(--text-dim); margin:16px 0 0; }
  .sub a { color:inherit; text-decoration:none; border-bottom:1px solid var(--border); }
  .sub a:hover { color:var(--accent); border-color:var(--accent); }

  main.wrap { flex:1; padding-top:24px; padding-bottom:96px; }
  .controls { display:flex; gap:8px; margin:0 0 28px; }
  .controls button {
    font-family:inherit; font-size:12px; font-weight:500; cursor:pointer;
    padding:7px 14px; border-radius:8px;
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
  }
  .controls button:hover { color:var(--text); border-color:var(--accent-dim); }
  .controls button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
  .controls button:focus-visible { outline:2px solid var(--accent-dim); outline-offset:2px; }

  .day { margin-bottom:26px; }
  .day-label {
    display:flex; align-items:center; gap:14px; margin:0 0 12px;
    font-family:var(--mono); font-size:10.5px; font-weight:600;
    letter-spacing:.09em; text-transform:uppercase; color:var(--text-faint);
  }
  .day-label::after { content:""; flex:1; height:1px; background:var(--border); }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px 18px; margin-bottom:10px; }
  .card:hover { border-color:var(--card-hover-border); }
  .stamp { font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  .card h2 { font-size:16px; font-weight:500; line-height:1.35; margin:6px 0 6px; }
  .card p { margin:0; font-size:13.5px; line-height:1.6; color:var(--text-dim); }
  .empty { color:var(--text-faint); font-size:13px; }

  /* ---- Site footer (same look as the rest of the site) ---- */
  .site-footer {
    margin:0 var(--site-gutter); padding:30px 0 34px;
    border-top:1px solid var(--site-line);
    display:flex; justify-content:space-between; gap:24px; flex-wrap:wrap;
    font-family:var(--site-sans); font-size:12px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--site-ink);
  }

  @media (max-width:560px) {
    .site-header { padding-top:32px; }
    .site-header .logo { font-size:36px; }
    .site-header nav { gap:22px; font-size:15px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="/" class="logo" aria-label="Michèle du Toit, home">M.</a>
  <nav>
    <a href="/projects/">projects</a>
    <a href="/contact/">contact</a>
  </nav>
</header>

<div class="diary-head">
  <div class="wrap">
    <div class="top">
      <h1>Founder's Diary</h1>
      <div class="tag">KAIROVERSE &nbsp;&bull;&nbsp; $100k Hackathon &nbsp;&bull;&nbsp; Ship Or Die</div>
    </div>
    <p class="sub"><a href="https://x.com/michele_dutoit" target="_blank" rel="noopener noreferrer">Michèle du Toit</a> &nbsp;&bull;&nbsp; 16 Nov &ndash; 16 Dec 2026</p>
    <p class="intro">You can just do things. Build the change you want to see in the world.</p>
  </div>
</div>

<main class="wrap">
  <div class="controls" role="group" aria-label="Sort posts">
    <button id="newest" aria-pressed="true">Recent First</button>
    <button id="oldest" aria-pressed="false">Recent Last</button>
  </div>
  <div id="feed"></div>
</main>

<footer class="site-footer">
  <span>Michèle du Toit</span>
  <span>Johannesburg, South Africa</span>
</footer>

<script>
/* ADD POSTS HERE.
   Copy a line, change the date/time (YYYY-MM-DDTHH:MM, 24h), title and body.
   Order in this list doesn't matter; the page sorts by date and time. */
const posts = [
  { time: "2026-11-16T16:42", title: "Day 1 of the Hackathon", body: "I want to build a platform that helps people understand and communicate the full breadth of who they are, not just what fits neatly in a keyword-optimized CV. I think modern recruitment needs a fundamental shift. I'll be tracking my progress here throughout the first 30 days of building the Kairoverse." },
];

const feed = document.getElementById("feed");
const btnNew = document.getElementById("newest");
const btnOld = document.getElementById("oldest");
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad = n => String(n).padStart(2, "0");
const dayLabel = d => `${pad(d.getDate())} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const stampLabel = d => `${dayLabel(d)}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function render(newestFirst) {
  const sorted = posts
    .map(p => ({ ...p, date: new Date(p.time) }))
    .sort((a, b) => newestFirst ? b.date - a.date : a.date - b.date);

  feed.replaceChildren();
  if (!sorted.length) { feed.append(el("p", "empty", "No posts yet. Add one to the posts list in this file.")); }

  let section = null, lastDay = "";
  for (const p of sorted) {
    const day = dayLabel(p.date);
    if (day !== lastDay) {
      section = el("section", "day");
      section.append(el("h3", "day-label", day));
      feed.append(section);
      lastDay = day;
    }
    const card = el("article", "card");
    card.append(el("div", "stamp", stampLabel(p.date)), el("h2", "", p.title), el("p", "", p.body));
    section.append(card);
  }

  btnNew.setAttribute("aria-pressed", newestFirst);
  btnOld.setAttribute("aria-pressed", !newestFirst);
}

btnNew.addEventListener("click", () => render(true));
btnOld.addEventListener("click", () => render(false));
render(true);
</script>
</body>
</html>
